# pyproject.toml — divoom-control
#
# R14 §4 — first time this repo has a packaging file. Replaces the
# need to keep requirements.txt in sync with install instructions.
# Verifies that `pip install -e .` actually works, and exposes the
# `divoom-control` CLI as a real entry point.
#
# Build backend: setuptools (most common, no extra deps).
# Python: 3.14 (CI, the local venv and the shipped app all build on 3.14;
# the floor matches reality -- nothing below 3.14 is tested anywhere).
#
# Optional extras:
#   pip install -e ".[gui]"        # pywebview (macOS GUI)
#   pip install -e ".[test]"       # pytest + pytest-asyncio
#   pip install -e ".[dev]"        # both
#
# Entry points:
#   divoom-control  → divoom_lib.cli:main
#
# The legacy `./divoom-control` shell wrapper is kept for in-tree
# development — it works without installing the package.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divoom-control"
version = "0.40.0"
description = "macOS control surface for Divoom pixel displays (Pixoo / Tivoo / Ditoo / Timoo)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "Zach Tomer" },
]
keywords = ["divoom", "pixoo", "tivoo", "ditoo", "timoo", "ble", "bluetooth", "pixel-display"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Graphics",
]

# Core deps (no GUI; pure lib + CLI). The GUI extras live below.
dependencies = [
    "bleak",
    "aiohttp",
    # Floored at 12: `get_flattened_data()` (the `getdata()` replacement --
    # `getdata` is removed in Pillow 14) exists only on 12+. Latest 12.3.0
    # as of 2026-09-20; the float above the floor tracks CI (unpinned there).
    "pillow>=12",
    "pycryptodome",
    "lzallright",
    "tomli-w",
]

[project.optional-dependencies]
# macOS-only Control Center (pywebview + native menu bar).
gui = [
    "pywebview; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]
test = [
    "pytest",
    "pytest-asyncio",
]
dev = [
    "divoom-control[gui,test]",
]

[project.scripts]
# `divoom-control` → `python -m divoom_lib.cli` (the CLI main).
divoom-control = "divoom_lib.cli:main"

[project.urls]
# Update these once the repo has a public home.
"Source" = "https://github.com/ztomer/divoom_control"
"Issues" = "https://github.com/ztomer/divoom_control/issues"

# ── setuptools: package discovery + data files ───────────────────────

[tool.setuptools]
# The retained core (divoom_lib: framing, models, transport interface, auth,
# native_lib, the CLI/MCP clients), the daemon client and the GUI package
# (macOS only). The direct-to-device library is NOT shipped: it was retired
# to examples/divoom_legacy on 2026-09-14 and is excluded below. Native
# The web_ui/ directory is package data.
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["divoom_lib*", "divoom_client*", "divoom_gui*"]
exclude = ["tests*", "examples*", "references*", "scripts*", "docs*"]

[tool.setuptools.package-data]
# The web UI ships with the `divoom_gui` package.
#
# No native binary is shipped any more (phase L4, 2026-09-25): `divoom_lib` used
# to bundle `libdivoom_compact.{dylib,so}` and its C sources, which the daemon
# loaded through `divoom_lib/native_lib.py` for the image encoders. Those
# encoders are Rust in the daemon binary now, so the globs that put a
# per-platform build artifact in the wheel are gone with the artifact.
divoom_lib = [
    # R28: bundled bitmap font for device-bound text (APK-derived, see
    # divoom_lib/fonts/ + scripts/extract_apk_font.py).
    "fonts/*.bin",
]
divoom_gui = [
    "web_ui/*",
]

# ── pytest ────────────────────────────────────────────────────────────

# pytest is configured ENTIRELY in pytest.ini. There was a
# [tool.pytest.ini_options] block here and pytest ignored all of it -- an ini
# file always wins, and pytest prints a warning saying so on every run. It is
# not duplicated here on purpose: two config files where only one is read is
# how settings get "changed" with no effect.
#
# Environment-dependent tests are gated by conftest.py opt-in flags
# (--run-hardware, --run-browser, --run-cloud), not by markers.


[tool.coverage.run]
# Reproducible baseline so `coverage run -m pytest` measures the same tree
# every time (see REVIEW_2026-06 §0.3 — the prior review quoted a coverage
# table that did not match reality). Real TOTAL was 62% on 2026-06-09.
source = ["divoom_lib", "divoom_gui", "divoom_client"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
