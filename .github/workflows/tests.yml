name: tests

# ONE job, ONE command: `./tools/gate.sh --full`, the command the pre-push hook runs (structural,
# then tools/repo_gates.sh over .gatesrc's GOH_CI_STEPS), so CI and the local gate cannot drift
# (CI.PUBLIC2, 2026-11-08). The steps before it only PROVISION the runner: the toolchains, the
# Python dependencies and the pinned camoufox browser the GOH_CI_STEPS steps need. A check added to
# the gate is in CI the moment it is in .gatesrc; nothing here restates one.
#
# Every action is pinned to a released tag's commit, the tag beside it, and gates_of_heck to a
# NAMED release; raise either in its own commit, never to a moving tag.

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    # macOS: clang builds the dylib, the native encoder tests and the BLE build run, and
    # divoom-menubar (Apple-target code) builds only here.
    runs-on: macos-26
    # A dead runner hung the browser e2e step 70+ min; the old jobs' longest was 27.7 min.
    timeout-minutes: 90
    env:
      GOH_DIR: ${{ github.workspace }}/goh
    steps:
      # persist-credentials: false on EVERY checkout: by default checkout leaves the job token in
      # git config, which the structural gate's no-credential-in-git-config check refuses.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The house gates, consumed via GOH_DIR and never vendored. gates_of_heck is public, so
      # the job's default token reads it.
      - name: Check out gates_of_heck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ztomer/gates_of_heck
          ref: v0.96.0   # a NAMED goh release, never main (CI.PUBLIC, 2026-11-08); raise it deliberately
          path: goh
      # goh's tool floors (python3, shellcheck), from goh's own floor table.
      - name: Meet goh's tool floors
        uses: ./goh/.github/actions/goh-floors
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      # The newest stable release (house rule), with the components the gate's rust steps run.
      - name: Rust toolchain (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview
          rustup default stable
          rustc -V
      # The tools goh's gates refuse to run without, from goh's manifest rather than a copy.
      - name: Install the tools the gate requires
        run: |
          set -euo pipefail
          cmds="$(python3 "$GOH_DIR/gates/required_tools.py" --repo . --install)"
          printf '%s\n' "$cmds"
          grep -v '^#' <<<"$cmds" | bash -eux
      # The repo's own cross-check and coverage steps (scripts/check_linux_build.sh,
      # scripts/rust_coverage.sh) need tools goh's manifest does not list, each at a NAMED
      # release: cargo-zigbuild and cargo-llvm-cov from crates.io (--locked), zig from its
      # release tarball, checked against the sha256 ziglang.org publishes for it.
      - name: Install the repo's cross-build and coverage tools
        env:
          ZIG_VERSION: "0.17.1"
          ZIG_SHA256: 75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-gnu
          cargo install --locked cargo-zigbuild@0.24.1 cargo-llvm-cov@0.9.1
          tarball="zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://ziglang.org/download/${ZIG_VERSION}/${tarball}"
          echo "${ZIG_SHA256}  $RUNNER_TEMP/$tarball" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - name: Install dependencies
        # camoufox imports PyYAML's C loader unconditionally
        # (`from yaml import CLoader` in camoufox/pkgman.py and geolocation.py,
        # still so in 0.5.8). PyYAML ships no wheel for a new CPython (none for
        # 3.15 as of 6.0.3), so pip builds the sdist, and without libyaml
        # headers on the include path that build SUCCEEDS as pure Python --
        # then every `python -m camoufox` dies with `cannot import name
        # 'CLoader'`. That was 19 of 20 red main runs in 2026-10. The fix is
        # the dependency, not the interpreter: give the build libyaml, and set
        # PYYAML_FORCE_LIBYAML=1 so a build that cannot find it FAILS here
        # instead of installing a module that fails three steps later.
        env:
          PYYAML_FORCE_LIBYAML: "1"
        run: |
          brew install libyaml
          BREW_PREFIX="$(brew --prefix)"
          export CFLAGS="-I${BREW_PREFIX}/include ${CFLAGS:-}"
          export LDFLAGS="-L${BREW_PREFIX}/lib ${LDFLAGS:-}"
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          # pytest + pillow are also in requirements.txt (which is installed
          # with `|| true` above, so the authoritative install is this line).
          #
          # The browser drivers come from the DECLARED [e2e] extra, not from a
          # literal here: playwright + camoufox were reachable only through this
          # line, which is why scripts/py_ci.sh could only WARN when the browser
          # was missing -- nothing declared the dependency. The camoufox pin now
          # lives in pyproject.toml and has one copy.
          # NOTE: the pip pin is not the one that decides whether the e2e suite
          # passes -- the BROWSER BUILD is (see the fetch step below).
          # camoufox accepts any build in [alpha.1, 1), so pinning the package
          # alone still lets `fetch` take the newest.
          pip install pytest pytest-xdist pytest-cov pillow -e '.[e2e]'
          # The artifact, not the exit code: the C loader camoufox needs is there.
          python -c 'import yaml, camoufox.pkgman; assert yaml.__with_libyaml__, "PyYAML built without libyaml"'

      - name: Install the camoufox browser
        # The GUI e2e suites (15 modules) drive headless camoufox via
        # tests/support/browser.py. Without the binary they genuinely SKIP
        # (tests/test_e2e_browser_guard.py pins that) — before R66 the
        # importorskip guard only checked the Python module, so a missing
        # browser produced 69 failures that looked like real regressions.
        #
        # `camoufox fetch` EXITS 0 WHEN IT INSTALLS NOTHING. Run 32654312489
        # hit GitHub's unauthenticated API rate limit (60/hr, shared across
        # every Actions runner on that egress IP), printed three 403s and
        # "Synced 0 versions from 0 repos.", and still reported this step
        # green. The damage surfaced later, in pytest, looking like a test
        # regression. Two independent fixes, because either alone still lies:
        #   1. GITHUB_TOKEN removes the CAUSE — camoufox reads it (pkgman.py)
        #      and it lifts the limit to 1000/hr/repo.
        #   2. The verify step removes the SILENCE — a step that cannot fail
        #      is not a gate, so we check the artifact, not the exit code.
        #
        # The BROWSER BUILD is pinned, and pinning the pip package is NOT
        # enough: camoufox accepts any build in [alpha.1, 1), so a bare `fetch`
        # takes the newest. The pin is `.camoufox-build` -- the ONE declaration,
        # read through tools/camoufox_installed.py --spec here and by the local
        # gate's scripts/browser_e2e.sh, so CI and the dev machine run the same
        # build (owner ruling 2026-10-19; P1.13). Never write a build literal in
        # this file: tests/test_camoufox_install_check.py fails one.
        # `fetch` asks before installing a prerelease and aborts on a closed
        # stdin, hence the `printf 'y\n'`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          SPEC="$(python3 tools/camoufox_installed.py --spec)" || exit 1
          # The retry LOOPS ON THE VERIFICATION, not on the exit code. Looping on
          # the exit code would never retry the failure we actually saw, because
          # that failure exits 0 -- the loop would break on attempt 1 every time.
          for attempt in 1 2 3; do
            # `fetch <spec>` also SYNCS the repo list; `set` alone fails on a
            # clean runner with "No repo cache found. Run 'camoufox sync'
            # first." -- and there is no `sync` subcommand, so that advice is
            # unfollowable. Fetching only the pinned build makes it the active
            # one; `set` afterwards is belt-and-braces if anything else exists.
            printf 'y\n' | python -m camoufox fetch "$SPEC" || true
            python -m camoufox set "$SPEC" || true
            if python3 tools/camoufox_installed.py; then
              exit 0
            fi
            echo "attempt ${attempt}: no browser installed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          python3 tools/camoufox_installed.py  # emit the failure and exit non-zero
          exit 1

      - name: The gate
        env:
          DIVOOM_BROWSER_WORKERS: "0"
        run: ./tools/gate.sh --full

  # The Linux --all-features lint (scripts/check_linux_all_features.sh) runs in docker, which
  # the macOS runner above does not have; there the step says NOT APPLICABLE, and here the same
  # script runs unedited on a Linux runner that has docker (CI.PUBLIC2).
  linux-all-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOH_DIR: ${{ github.workspace }}/goh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out gates_of_heck
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: ztomer/gates_of_heck
          ref: v0.96.0   # the same NAMED goh release as the gate job
          path: goh
      # goh's floors (the house Python 3.15): the runner's /usr/bin/python3 is 3.12, below it.
      - name: Meet goh's tool floors
        uses: ./goh/.github/actions/goh-floors
      - name: The cargo dirs the container mounts
        run: mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
      - run: ./scripts/check_linux_all_features.sh
