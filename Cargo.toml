[workspace]
resolver = "2"
members = [
    "divoomd",
    "divoom-menubar",
    "nowplaying",
]

# references/ holds three VENDORED Cargo projects (gitignored) kept as protocol
# ground truth -- see AGENTS.md. They are not ours to build. Without excluding
# them, every cargo invocation under this root fails with "current package
# believes it's in a workspace when it's not".
exclude = ["references"]

[workspace.lints.clippy]
# Adopted 2026-09-07. No crate here had a clippy policy, so `pedantic` and
# `nursery` had never run against any of them -- 1750 findings nothing
# reported. Fixed rather than baselined; the gate runs at `-D warnings`, so
# this is a ratchet.
#
# NOT included, deliberately: `unwrap_used` / `expect_used` / `panic`. Those are
# `restriction` rather than `pedantic`, and turning them on is a correctness
# campaign with its own review, not a lint sweep.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# One shared build directory for both crates instead of a target/ per crate.
# Paired with .cargo/config.toml, which pins it to a repo-local ./target so the
# packaging scripts (setup_app.py, divoom.spec) and the runtime resolvers in
# gui_main.py / daemon_client.py keep finding the binaries by path.
