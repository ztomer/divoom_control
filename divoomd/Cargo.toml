[package]
name = "divoomd"
version = "0.41.0"
edition = "2021"
description = "Native (Rust) port of the Divoom daemon — built in parallel to the Python daemon, which stays ground truth."
publish = false

[lib]
name = "divoomd"
path = "src/lib.rs"

[[bin]]
name = "divoomd"
path = "src/main.rs"

[features]
default = ["ble"]
# `ble` pulls the platform BLE stack (btleplug). The protocol/transport core +
# its tests build and run WITHOUT it (`--no-default-features`), keeping the tested
# core hardware- and platform-free.
ble = ["dep:btleplug", "dep:futures", "dep:uuid"]

[dependencies]
libc = "0.2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "io-std", "signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libloading went with the C FFI wrapper (phase L4): it existed only to
# dlopen libdivoom_compact, and cargo machete says so.
# libloading = "0.9"
base64 = "0.23"
# `tiff` is required, not optional: macOS MediaRemote returns TIFF cover art
# (while declaring image/jpeg — see nowplaying/src/artwork.rs). Without it
# every real album cover fails to decode.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff"] }
btleplug = { version = "0.13", optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", optional = true }
# `webpki-roots` is GONE and must not come back. reqwest 0.13.2 deleted that
# optional dependency, which silently deleted the implicit feature of the same
# name. Nothing errored: `cargo update` simply could not move reqwest past
# 0.13.1 and said so only in a parenthetical ("available: v0.13.5") while
# exiting 0. The repo sat on 0.13.1 for months believing it was current.
# `tools/check_cargo_features.py` now fails on that class outright.
#
# `rustls` pulls `rustls-platform-verifier`, so trust anchors now come from the
# OS trust store (the macOS Keychain) instead of a bundled Mozilla CA bundle.
# That is upstream's intended migration, but it is a real behavioural change
# for a daemon that signs requests to https://appin.divoom-gz.com, so it was
# verified rather than assumed, on 2026-10-04, three ways through reqwest
# 0.13.5 itself:
#   verified   + the real vendor host        -> HTTP 200 (Keychain validates it)
#   verified   + a self-signed cert          -> REJECTED, "certificate is not
#                                              trusted: -67843" (macOS SecTrust)
#   UNverified + that same self-signed cert  -> HTTP 200, so the rejection
#                                              above was the certificate and
#                                              not a dead port
# The middle case is the one that counts: without it, the 200 on the left could
# just as easily mean verification was switched off. To re-verify after a future
# reqwest bump, repeat that three-way probe -- the positive half alone proves
# nothing.
reqwest = { version = "0.13", features = ["json", "rustls", "query", "charset"] }
rusqlite = { version = "0.40", features = ["bundled"] }
plist = "1"
sysinfo = "0.39"
md-5 = "0.11"
sha1 = "0.11"
aes = "0.9"
cbc = "0.2"
hmac = "0.13"
# LZO1X decompression for magic 18/26 cloud containers (parity with the Python
# daemon's lzallright/liblzo2). Pure Rust port of minilzo.
minilzo-rs = "0.6"

# Now-playing + album artwork as real bytes (macOS MediaRemote via an
# entitled perl host). Replaces the AppleScript + iTunes-Search guessing.
[target.'cfg(target_os = "macos")'.dependencies]
nowplaying = { path = "../nowplaying" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
tempfile = "3"
lazy_static = "1.4"

[lints]
workspace = true

# cargo-machete scans for the crate's IDENT and `md-5`'s lib is `md5`, so it
# reads as unused while `cloud.rs` uses it for the Divoom cloud API's signature
# (`Md5::new()`, and `Hmac<Md5>`). A package whose lib name differs from its
# package name is the tool's documented blind spot.
[package.metadata.cargo-machete]
ignored = ["md-5"]
