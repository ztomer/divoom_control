# cargo-audit configuration.
#
# THE IGNORE LIST IS A RATCHET, NOT A RUG. Every entry below is one of exactly
# the advisories present when the gate was introduced (2026-09-07), each with the
# reason it may stand. Anything NEW fails the build. An entry whose advisory no
# longer fires should be DELETED, not left to rot -- a stale exemption is a hole
# held open for the next real finding to fall through.
#
# EMPTY since 2026-09-21: the tao -> gtk edge is gone (divoom-menubar runs on
# winit now), so all eleven GTK3-subtree ignores stopped firing and were
# deleted per the rule above -- verified `cargo audit` green with `ignore = []`.
# The winit default-features subtree would have added a twelfth
# (RUSTSEC-2026-0192 ttf-parser via sctk-adwaita); winit is
# `default-features = false` instead, so it never entered the lock.
[output]
# Any advisory at all fails, including the informational ones. Without this,
# cargo-audit exits 0 on "unmaintained"/"unsound" (they are warnings by default),
# so the gate would pass over exactly the class it was added to police and the
# ignore list below would be decorative. Found by calibration, not by reading.
quiet = false
deny = ["warnings", "unmaintained", "unsound", "yanked"]

[advisories]
ignore = []
