# Repo-local target dir — overrides the machine-wide shared target-dir in
# ~/.cargo/config.toml.
#
# This app's build output must be repo-local and predictable: setup_app.py and
# divoom.spec collect divoomd + divoom-menubar into the shipped .app/DMG by
# path, gui_main.py and daemon_client.py resolve the binaries at runtime, and
# five test modules spawn them. Building into a machine-wide shared dir would
# leave all of those pointing at whatever stale binary was last built in-tree —
# silently shipping a stale daemon rather than failing loudly.
#
# R66 Phase 3 additionally replaces the hardcoded "<crate>/target/..." literals
# with `cargo metadata`-derived resolution, so the paths stay correct even if
# this override is ever removed.
[build]
target-dir = "target"
