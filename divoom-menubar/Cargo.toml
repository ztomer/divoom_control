[package]
name = "divoom-menubar"
version = "0.39.0"
edition = "2021"
description = "Native (Rust) menubar/tray agent for divoom-control. Talks to divoomd over the NDJSON socket, shows status + active devices, and launches the Python pywebview GUI. Replaced the pyobjc menubar, which was removed in R66 (2026-08-17)."
publish = false

[[bin]]
name = "divoom-menubar"
path = "src/main.rs"

# Event loop (winit) + status item (tray-icon). tray-icon needs an event loop
# on the main thread; winit runs it via `run_app`. Previously tao (a winit
# fork) filled this role, but tao depends on gtk ^0.18 non-optionally on Linux
# targets -- the last gtk/glib/proc-macro-error edge in the lock -- while
# winit uses x11rb/Wayland there and pulls no gtk on any target.
# winit WITHOUT default features: upstream defaults ("x11", "wayland",
# "wayland-dlopen", "wayland-csd-adwaita") pull the Linux backend stack
# (x11rb, wayland, sctk-adwaita → ab_glyph → unmaintained ttf-parser) for a
# product that is a macOS-only Accessory agent (no Linux job builds this crate
# -- tests.yml scopes Ubuntu jobs `-p divoomd`). The macOS AppKit backend is
# not feature-gated, so this compiles to identical code here while keeping
# those crates out of Cargo.lock entirely.
# tray-icon WITHOUT default features: upstream defaults ("gtk", "libxdo")
# forward only to Linux-target-gated deps (macOS compiles to objc2/AppKit
# code either way), for a product that is a macOS-only Accessory agent
# (no Linux job builds this crate -- tests.yml scopes Ubuntu jobs `-p divoomd`).
[dependencies]
tray-icon = { version = "0.24", default-features = false }
winit = { version = "0.30", default-features = false }
serde_json = "1"
# Panel tiles: decode the daemon's PNG frame previews into menu icons.
image = { version = "0.25", default-features = false, features = ["png"] }

# macOS: wake the main CFRunLoop so the status item shows up on first paint, and
# (via winit) run as an Accessory app (no Dock icon — it's a menubar agent).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop"] }

[lints]
workspace = true
