[package]
name = "divoom-menubar"
version = "0.41.0"
edition = "2021"
description = "Native (Rust) menubar/tray agent for divoom-control. Talks to divoomd over the NDJSON socket, shows status + active devices, and launches the Python pywebview GUI. Replaced the pyobjc menubar, which was removed in R66 (2026-08-17)."
publish = false

[[bin]]
name = "divoom-menubar"
path = "src/main.rs"

# Event loop (winit) + status item (tray-icon). tray-icon needs an event loop
# on the main thread; winit runs it via `run_app`. Previously tao (a winit
# fork) filled this role, but tao depends on gtk ^0.18 non-optionally on Linux
# targets -- the last gtk/glib/proc-macro-error edge in the lock -- while
# winit uses x11rb/Wayland there and pulls no gtk on any target.
# winit WITHOUT default features: upstream defaults ("x11", "wayland",
# "wayland-dlopen", "wayland-csd-adwaita") pull the Linux backend stack
# (x11rb, wayland, sctk-adwaita → ab_glyph → unmaintained ttf-parser) for a
# product that is a macOS-only Accessory agent (no Linux job builds this crate
# -- tests.yml scopes Ubuntu jobs `-p divoomd`). The macOS AppKit backend is
# not feature-gated, so this compiles to identical code here.
#
# tray-icon WITHOUT default features: upstream 0.26 defaults to
# ["libappindicator"], which drags in the GTK StatusNotifierItem path -- for a
# product that is a macOS-only Accessory agent (no Linux job builds this crate,
# tests.yml scopes Ubuntu jobs to `-p divoomd`). Every macOS dependency
# (objc2, objc2-app-kit, png, crossbeam-channel) is unconditional and
# `cfg(target_os = "macos")`-targeted, so dropping the default selects the
# identical objc2/AppKit source path. muda, which tray-icon re-exports, is
# declared `default-features = false` upstream, so gtk stays out regardless.
#
# The invariant to state is the OBSERVABLE one, not the upstream default list,
# because the latter rots: this comment named tray-icon 0.24's ("gtk",
# "libxdo") for months after 0.26 deleted the `libxdo` feature outright and
# renamed `gtk` to `libappindicator`. `libxdo` no longer exists in either
# tray-icon 0.26 or muda 0.21. What actually holds, and what to re-check after
# any bump, is: `cargo tree --target all -i gtk -i gtk3 -i libappindicator -i
# libxdo` matches nothing. Note `dirs` IS legitimately in the lock, as a
# non-optional Linux/BSD dep of tray-icon, so "out of the lock entirely" would
# be the wrong claim -- it is the gtk family that must be absent.
#
# LATENT TRAP, verified in tray-icon 0.26's own source: that version adds a hard
# `compile_error!("either the `libappindicator` or `ksni` feature must be enabled
# on Linux and BSD")`, gated on `any(linux, dragonfly, freebsd, netbsd,
# openbsd)` and `not(any(libappindicator, ksni))`. Our `default-features = false`
# enables neither, so this crate CANNOT compile for Linux or BSD as configured.
# Unreachable today -- every cargo step in tests.yml's Ubuntu jobs is scoped
# `-p divoomd`, and the whole-workspace steps (`cargo fmt --all`,
# `cargo clippy --all-targets --all-features`, `cargo test --locked`) all run on
# macos-latest -- but it is one workspace-wide cargo step added to a Linux job
# away from a red CI. If that happens the fix is a target-gated feature, NOT
# re-enabling tray-icon's default and pulling libappindicator back into the lock:
#
#   [target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
#   tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
#
# `ksni` is GTK-free (tray-icon 0.26's new StatusNotifierItem backend), so it
# preserves the invariant above instead of defeating it.
[dependencies]
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30", default-features = false }
serde_json = "1"
# Panel tiles: decode the daemon's PNG frame previews into menu icons.
image = { version = "0.25", default-features = false, features = ["png"] }

# macOS: wake the main CFRunLoop so the status item shows up on first paint, and
# (via winit) run as an Accessory app (no Dock icon — it's a menubar agent).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop"] }

# Linux/BSD: tray-icon 0.26 hard-fails to compile there unless `libappindicator`
# or `ksni` is enabled, and the macOS `[dependencies]` entry above deliberately
# enables neither. Unreachable today -- every cargo step in tests.yml's Ubuntu
# jobs is scoped `-p divoomd`, and the whole-workspace steps are macos-latest
# only -- so this is the fix BEFORE the CI job that needs it, not after.
#
# `ksni`, not `libappindicator`: `ksni` is tray-icon 0.26's GTK-free
# StatusNotifierItem backend, so it satisfies the compile_error WITHOUT pulling
# gtk/libappindicator/libxdo back into the lock. `libappindicator` would unblock
# the build and quietly break the invariant the macOS entry exists to hold, and
# the only symptom would be a lockfile nobody reads.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[lints]
workspace = true
